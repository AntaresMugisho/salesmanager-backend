[pytest]
DJANGO_SETTINGS_MODULE = stockmanager.settings_test
python_files = test_*.py
addopts = -q --strict-markers
testpaths = apps

# Fatal, not advisory. This warning flagged the sub-project 4 pagination bug
# for as long as it existed and nobody looked, because a warning scrolls past.
# An unordered queryset under pagination can drop or repeat rows between pages.
#
# The class lives in django.core.paginator, NOT rest_framework.pagination —
# DRF's paginator delegates to Django's Paginator, which is what emits it.
# Naming the DRF path does not silently no-op: pytest imports the category
# before Django is configured, so the whole suite dies at collection with
# ImproperlyConfigured. Loud, but nothing to do with pagination.
#
# Do not pass -p no:warnings when running the suite; that hides this again.
filterwarnings =
    error::django.core.paginator.UnorderedObjectListWarning
